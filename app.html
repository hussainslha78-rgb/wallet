  var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){if(!n.nodeValue.trim())continue;var t=n.nodeValue.replace(EMO_RE,'');if(t!==n.nodeValue&&t.trim())n.nodeValue=t;break;}});}

/* ── ترقيم الصفحات: بلوكات بتتحط وتتنقل لصفحة جديدة لو مكفتش · الجداول بتتقسم مع تكرار العناوين ── */
function rptPager(host,R){
  var P={pages:[],body:null,toc:[]},per=dlong(R.meta.from)+' ← '+dlong(R.meta.to);
  P.page=function(cover){var p=document.createElement('div');p.className='pr-page';p.innerHTML=(cover?'<div class="pr-cover">'+cover+'</div><div class="pr-body" style="top:282px"></div>':'<div class="pr-head"><div class="pr-ha">التقرير المالي الشامل</div><div class="pr-hb">'+esc(per)+'</div></div><div class="pr-body"></div>')+'<div class="pr-foot"><span>المحفظة · '+esc(R.meta.generated)+' · '+esc(R.meta.ver)+'</span><span class="pr-pn"></span></div>';host.appendChild(p);P.pages.push(p);P.body=p.querySelector('.pr-body');return p;};
  P.fits=function(){return P.body.scrollHeight<=P.body.clientHeight+1;};
  P.left=function(){var last=P.body.lastElementChild;return P.body.clientHeight-(last?last.offsetTop+last.offsetHeight:0);};
  /* بلوك اتنقل لصفحة جديدة: لو قبله عنوان قسم لوحده يتنقل معاه (مايفضلش عنوان يتيم آخر الصفحة) */
  P.move=function(el){if(el.parentNode)el.parentNode.removeChild(el);var prev=P.body.lastElementChild,carry=prev&&prev.getAttribute('data-kwn')&&P.body.childElementCount>1?prev:null;
    if(carry)P.body.removeChild(carry);P.page();if(carry){P.body.appendChild(carry);if(carry._toc)carry._toc[2]=P.pages.length;}P.body.appendChild(el);if(el._toc)el._toc[2]=P.pages.length;
    var f=P.body.firstElementChild;if(f&&f.classList)f.classList.remove('pr-gap');};
  P.add=function(html,o){o=o||{};if(!P.body||o.page)P.page();var w=document.createElement('div');w.innerHTML=html;var el=w.childElementCount===1?w.firstElementChild:w;
    P.body.appendChild(el);if((!P.fits()||(o.keep&&P.left()<o.keep))&&P.body.childElementCount>1)P.move(el);return el;};
  P.sec=function(no,title,lead,o){o=o||{};P.toc.push([no,title,0]);var fresh=!P.body||!P.body.childElementCount,nw=o.page||(!fresh&&P.left()<P.body.clientHeight*0.4);
    var el=P.add('<div data-kwn="1"'+(!fresh&&!nw?' class="pr-gap"':'')+'><div class="pr-sec"><span class="pr-no">'+no+'</span>'+esc(title)+'</div>'+(lead?'<div class="pr-lead">'+lead+'</div>':'')+'</div>',{page:nw,keep:200});el._toc=P.toc[P.toc.length-1];el._toc[2]=P.pages.length;return el;};
  P.sub=function(t){return P.add('<div class="pr-sub">'+esc(t)+'</div>',{keep:90});};
  P.note=function(t){return P.add('<div class="pr-note">'+t+'</div>');};
  /* T: {head:[[label,'n'?]...], rows:[[cells], cls?], foot?:[cells], title?} — الخلايا HTML جاهز */
  P.table=function(T){var cols=T.head.map(function(h){return h[1]?'pr-'+h[1]:'';});
    var thead='<thead><tr>'+T.head.map(function(h){return '<th class="'+(h[1]?'pr-'+h[1]:'')+'"'+(h[2]?' style="width:'+h[2]+'"':'')+'>'+h[0]+'</th>';}).join('')+'</tr></thead>';
    var tr=function(r){var cells=r.c||r,cls=r.cls?'pr-'+r.cls:'';return '<tr class="'+cls+'">'+cells.map(function(c,i){return '<td class="'+(cols[i]||'')+(r.ind&&i===0?' pr-ind':'')+'">'+(c===undefined||c===null?'':c)+'</td>';}).join('')+'</tr>';};
    var rows=T.rows.slice();if(T.foot)rows.push({c:T.foot,cls:'tot'});
    if(!rows.length)return;
    var nt=T.note?'<div class="pr-note">'+T.note+'</div>':'';
    var whole=function(){var h='<div>'+(T.title?'<div class="pr-sub">'+esc(T.title)+'</div>':'')+'<table class="pr-t'+(T.sm?' pr-sm':'')+'">'+thead+'<tbody>'+rows.map(tr).join('')+'</tbody></table>'+nt+'</div>';
      if(!P.body)P.page();var w=document.createElement('div');w.innerHTML=h;var el=w.firstElementChild;P.body.appendChild(el);if(P.fits())return true;
      var hh=el.offsetHeight;P.body.removeChild(el);if(hh<=P.body.clientHeight*0.42&&P.body.childElementCount){P.move(el);return true;}return false;};
    if(whole())return;
    var start=function(cont){var t=P.add('<div>'+(T.title?'<div class="pr-sub">'+esc(T.title)+(cont?' <span style="font-weight:400;color:#94a3b8">(تابع)</span>':'')+'</div>':'')+'<table class="pr-t'+(T.sm?' pr-sm':'')+'">'+thead+'<tbody></tbody></table></div>',{keep:T.title?110:60});return t.querySelector('tbody');};
    var tb=start(false),n=0;
    for(var i=0;i<rows.length;i++){var tmp=document.createElement('tbody');tmp.innerHTML=tr(rows[i]);var row=tmp.firstElementChild;tb.appendChild(row);
      if(!P.fits()){tb.removeChild(row);if(!n){P.move(tb.parentNode.parentNode);tb.appendChild(row);n++;continue;}
        P.page();tb=start(true);tb.appendChild(row);n=1;continue;}n++;}
    if(nt){var wr=tb.parentNode.parentNode,tmpn=document.createElement('div');tmpn.innerHTML=nt;var ne=tmpn.firstElementChild;wr.appendChild(ne);
      if(!P.fits()){wr.removeChild(ne);var mv=[];while(tb.children.length>3&&mv.length<3)mv.unshift(tb.removeChild(tb.lastElementChild));   /* الملاحظة ماتفضلش لوحدها: آخر صفوف بتنزل معاها */
        if(mv.length){P.page();var tb2=start(true);mv.forEach(function(r){tb2.appendChild(r);});tb2.parentNode.parentNode.appendChild(ne);}else P.note(T.note);}}};
  /* رسم: {h, cfg} — الكانفاس بيترسم بعد الترقيم */
  P.charts=[];
  P.chart=function(h,cfg,title,rtl){var id='rpc'+P.charts.length;P.charts.push({id:id,h:h,cfg:cfg,rtl:rtl});P.add('<div>'+(title?'<div class="pr-sub">'+esc(title)+'</div>':'')+'<div class="pr-chart"><canvas id="'+id+'" width="692" height="'+h+'" style="width:692px;height:'+h+'px"></canvas></div></div>',{keep:h+40});};
  return P;}

/* ── الأقسام ── */
function rptBuild(R,host){var P=rptPager(host,R),M=R.meta,Sm=R.summary,RP=R.report,Rt=R.ratios,B=R.behavior,NW=R.netWorth,pf=R.portfolio||{};
  var cur=' '+(M.currency||'ج.م');
  /* الغلاف + الملخص التنفيذي */
  P.page('<div class="pr-ck">تقرير تحليل مالي شخصي · سرّي</div><div class="pr-ch">التقرير المالي الشامل</div><div class="pr-cs">الأداء والسلوك المالي من '+esc(dlong(M.from))+' إلى '+esc(dlong(M.to))+' ('+M.days+' يوم)</div>'+
    '<div class="pr-cm"><span>اتعمل: '+esc(M.generated)+'</span><span>العملة: '+esc(M.currency||'ج.م')+' · الدولار '+rN(M.usdRate,2)+'</span><span>'+rN(M.txCount)+' معاملة في الفترة</span><span>أول بيانات: '+rD(M.dataFrom)+'</span></div>');
  var kp=function(l,v,s,c){return '<div class="pr-kp"><div class="pr-kl">'+l+'</div><div class="pr-kv"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div>'+(s?'<div class="pr-ks">'+s+'</div>':'')+'</div>';};
  var nwV=R.netWorthMode==='لا تُخصم'?NW.netExCards:NW.net;
  P.add('<div><div class="pr-sub" style="margin-top:0">الملخص التنفيذي</div><div class="pr-kg">'+
    kp('صافي الثروة',rM(nwV),R.bsEnd?'في آخر الفترة '+rN(R.netWorthMode==='لا تُخصم'?R.bsEnd.netExCards:R.bsEnd.net):'أصول '+rN(NW.assets)+' · التزامات '+rN(NW.liabilities))+
    kp('الدخل',rM(Sm.income),'السابقة '+rN(Sm.prevIncome)+' · '+rCi(Sm.incomeChange))+
    kp('المصروفات',rM(Sm.expense),'السابقة '+rN(Sm.prevExpense)+' · '+rC(Sm.expenseChange))+
    kp('صافي الفترة',rS(Sm.net),'الدخل − المصروفات')+
    kp('معدل الادخار',rP(Sm.savingsRate),'المستهدف 20% أو أكتر',Sm.savingsRate===null?'':Sm.savingsRate>=20?RPT_C.inc:Sm.savingsRate<0?RPT_C.exp:RPT_C.amber)+
    kp('صندوق الطوارئ',Rt.emergencyMonths===null?'—':'<span dir="ltr">'+Rt.emergencyMonths+'</span> شهر','سيولة '+rN(Rt.liquid)+' ÷ متوسط صرف 6 شهور')+
    kp('الأقساط من الدخل (DTI)',rP(Rt.dti),'أقساط + جمعيات '+rN(Rt.debtService)+' شهرياً')+
    kp('عائد المحفظة السنوي',pf.xirr===null||pf.xirr===undefined?'—':rP(pf.xirr),pf.real===null||pf.real===undefined?'XIRR':'الحقيقي بعد التضخم '+rP(pf.real))+
    '</div></div>');
  if(!M.txCount)P.add('<div class="pr-ins pr-warn"><span class="pr-dot"></span><span>مفيش معاملات متسجلة في الفترة دي — اختار فترة أطول عشان التقرير يبقى له معنى.</span></div>');
  if((R.insights||[]).length)P.add('<div><div class="pr-sub">أهم الملاحظات</div>'+R.insights.slice(0,10).map(function(x){return '<div class="pr-ins pr-'+x.level+'"><span class="pr-dot"></span><span>'+esc(x.text)+'</span></div>';}).join('')+'</div>');
  var tocEl=P.add('<div><div class="pr-sub">محتويات التقرير</div><div class="pr-toc" id="rpToc"></div></div>');

  /* 1. قائمة الدخل والمصروفات */
  P.sec(1,'قائمة الدخل والمصروفات','مقارنة بالفترة اللي قبلها بنفس الطول ('+esc(dlong(M.prevFrom))+' ← '+esc(dlong(M.prevTo))+'). المرتجعات بتتخصم من فئتها، والتسويات والتحويلات بين حساباتك مش محسوبة دخل ولا مصروف.'+(M.prevPartial?' <b style="color:#b45309">بياناتك بتبدأ من '+esc(dlong(M.dataFrom))+' — الفترة السابقة ناقصة فالمقارنة بيها مش دقيقة.</b>':''),{page:true});
  P.table({title:'الملخص',head:[['البند'],['الفترة','n'],['الفترة السابقة','n'],['التغيير','n']],rows:[
    ['الدخل',rM(Sm.income),rM(Sm.prevIncome),rCi(Sm.incomeChange)],['المصروفات',rM(Sm.expense),rM(Sm.prevExpense),rC(Sm.expenseChange)],
    {c:['صافي الفترة',rS(Sm.net),rS(Sm.prevNet),rCi(Sm.netChange)],cls:'tot'},['معدل الادخار',rP(Sm.savingsRate),rP(Sm.prevIncome>0?(Sm.prevIncome-Sm.prevExpense)/Sm.prevIncome*100:null),''],
    ['متوسط الدخل الشهري',rM(Sm.avgMonthIncome),'',''],['متوسط المصروف الشهري',rM(Sm.avgMonthExpense),'',''],['متوسط الصرف اليومي',rM(Sm.avgDayExpense),'',''],
    ['مصروفات '+tagLbl('شخصي'),rM(Sm.personal),'',''],['مصروفات البيت',rM(Sm.house),'',''],
    ['المصروفات الموزّعة (التقسيط على شهوره)',rM(R.expenseAm),'',''],['معدل الادخار بعد التوزيع',rP(R.savingsRateAm),'','']].concat(R.memo&&R.memo.cashPlansNew>0?[['مشتريات تقسيط كاش جديدة (مش في المصروفات)',rM(R.memo.cashPlansNew),'','']]:[]),
    note:'المصروفات الموزّعة = نفس المصروفات بس المشتريات المقسطة متوزعة على شهور أقساطها بدل ما تتحسب كلها يوم الشراء، وبتشمل التقسيط الكاش. الرقمين صح — الأول بيقول اتصرف إمتى، والتاني بيقول اتدفع إمتى.'});
  var EX=(RP.expense&&RP.expense.groups)||[],rows=[];
  EX.forEach(function(g){rows.push({c:[esc(g.name),rM(g.total),rP(g.share),rM(g.prev),rC(g.change)],cls:'grp'});(g.cats||[]).slice(0,6).forEach(function(c){rows.push({c:[esc(c.name),rM(c.total),rP(c.share),rM(c.prev),rC(c.change)],ind:1});});});
  P.table({title:'المصروفات حسب المجموعة والفئة',head:[['المجموعة / الفئة'],['المبلغ','n'],['النسبة','n'],['السابقة','n'],['التغيير','n']],rows:rows,foot:['الإجمالي',rM(RP.expense.total),'100%',rM(RP.expense.prev),rC(RP.expense.change)],note:'نسبة الفئة من مجموعتها · نسبة المجموعة من إجمالي المصروفات. بيظهر أكبر 6 فئات في كل مجموعة — الجدول الكامل في قسم «تحليل الإنفاق».'});
  var SR=(R.sources&&R.sources.rows)||[];
  if(SR.length)P.table({title:'مصادر الدخل',head:[['المصدر'],['المبلغ','n'],['النسبة','n'],['السابقة','n'],['التغيير','n']],rows:SR.map(function(r){return [esc(r.name)+(r.kind==='inv'?' <span class="pr-mut">(عائد كلّي)</span>':''),rS(r.total),rP(r.share),rS(r.prev),rCi(r.change)];}),foot:['الإجمالي',rS(R.sources.total),'',rS(R.sources.prev),rCi(R.sources.change)],
    note:'الاستثمار هنا = توزيعات + ربح بيع محقق + تغيّر فرق الأسعار − رسوم (عائد كلّي، مش فلوس اتصرفت). الدخل في الملخص فوق = الفلوس اللي دخلت فعلاً بس.'});
  var inv=R.invIncome&&R.invIncome.detail;
  if(inv&&(inv.dividends||inv.realized||inv.fees||inv.unrealized))P.table({title:'تفصيل عائد الاستثمار في الفترة',head:[['البند'],['المبلغ','n']],rows:[['توزيعات وعوائد',rS(inv.dividends)],['ربح البيع المحقق',rS(inv.realized)],['تغيّر فرق الأسعار (غير محقق)',inv.unrealized===null?'<span class="pr-mut">مش معروف</span>':rS(inv.unrealized)],['رسوم ومصاريف',rS(-inv.fees)]],foot:['العائد الكلّي',rS(inv.total)]});

  /* 2. الاتجاه الشهري */
  var lng=R.months&&R.months.length>=3,cl=function(k,pt){var x=rMonP(k);return x?[x.m+(pt?' *':''),x.y]:String(k);};
  var MS=lng?R.months.map(function(x){return {l:rMon(x.key)+(x.partial?' *':''),c:cl(x.key,x.partial),inc:x.income,exp:x.expense,am:x.expenseAm,net:x.net,rate:x.rate,inv:x.invested,liq:x.liquid,p:x.partial};})
     :(R.trend12||[]).map(function(x){return {l:rMon(x.label),c:cl(x.label),inc:x.income,exp:x.expense,am:null,net:x.net,rate:x.income>0?x.savings:null,inv:null,liq:x.balance,p:false};});
  var hasAm=MS.some(function(x){return x.am!==null&&x.am!==undefined&&Math.abs(x.am-x.exp)>1;});
  P.sec(2,'الاتجاه الشهري',(R.months&&R.months.length>=3)?'كل شهر في الفترة. (*) = شهر ناقص (الفترة بتبدأ أو بتخلص في نصه).':'الفترة أقصر من 3 شهور — الاتجاه هنا لآخر 12 شهر عشان الصورة تبان.');
  P.chart(220,{type:'bar',data:{labels:MS.map(function(x){return x.c;}),datasets:[{label:'الدخل',data:MS.map(function(x){return x.inc;}),backgroundColor:RPT_C.inc,borderRadius:3,order:2},{label:'المصروفات',data:MS.map(function(x){return x.exp;}),backgroundColor:RPT_C.exp,borderRadius:3,order:2},{label:'الصافي',type:'line',data:MS.map(function(x){return x.net;}),borderColor:RPT_C.net,backgroundColor:RPT_C.net,borderWidth:2,pointRadius:2.5,tension:.25,order:1}].concat(hasAm?[{label:'المصروفات الموزّعة',type:'line',data:MS.map(function(x){return x.am;}),borderColor:RPT_C.amber,backgroundColor:RPT_C.amber,borderDash:[5,4],borderWidth:2,pointRadius:0,tension:.25,order:0}]:[])}},'الدخل والمصروفات والصافي');
  P.chart(150,{type:'line',data:{labels:MS.map(function(x){return x.c;}),datasets:[{label:lng?'السيولة آخر الشهر':'الرصيد آخر الشهر',data:MS.map(function(x){return x.liq;}),borderColor:RPT_C.pri,backgroundColor:'rgba(99,102,241,.12)',fill:true,borderWidth:2,pointRadius:2,tension:.25}]},options:{plugins:{legend:{display:false}}}},lng?'السيولة آخر كل شهر (كاش + بنوك + محافظ — من غير الاستثمار والكروت)':'الرصيد آخر كل شهر (كل الحسابات)');
  P.table({head:[['الشهر'],['الدخل','n'],['المصروفات','n']].concat(hasAm?[['موزّعة','n']]:[]).concat([['الصافي','n'],['الادخار','n'],['اتحط في الاستثمار','n'],[lng?'السيولة آخر الشهر':'الرصيد آخر الشهر','n']]),rows:MS.map(function(x){return [esc(x.l),rM(x.inc),rM(x.exp)].concat(hasAm?[rM(x.am)]:[]).concat([rS(x.net),rP(x.rate,0),x.inv===null?'—':rS(x.inv),rM(x.liq)]);}),note:hasAm?'«موزّعة» = المصروفات بعد توزيع المشتريات المقسطة على شهور أقساطها.':''});
  var ms=R.mStats;
  if(ms&&ms.months>=2){var sr=function(n,o){return [n,rM(o.mean),rM(o.median),rM(o.sd),o.cv===null?'—':'<span dir="ltr">'+Math.round(o.cv*100)+'%</span>',rM(o.min),rM(o.max)];};
    P.table({title:'إحصائيات الشهور الكاملة ('+ms.months+' شهر)',head:[['البند'],['المتوسط','n'],['الوسيط','n'],['الانحراف المعياري','n'],['معامل الاختلاف','n'],['أقل شهر','n'],['أعلى شهر','n']],rows:[sr('الدخل',ms.income),sr('المصروفات',ms.expense),sr('الصافي',{mean:ms.net.mean,median:ms.net.median,sd:ms.net.sd,cv:null,min:ms.net.min,max:ms.net.max})],note:'معامل الاختلاف = الانحراف المعياري ÷ المتوسط — أكتر من 35% يعني تذبذب عالي.'});}

  /* 3. تحليل الإنفاق */
  var C=R.cats||[];
  P.sec(3,'تحليل الإنفاق','توزيع المصروفات على الفئات، والأساسيات مقابل الكماليات، ووسائل الدفع.');
  var top=C.filter(function(c){return c.total>0;}).slice(0,10);
  if(top.length)P.chart(Math.max(150,top.length*24+30),{type:'bar',data:{labels:top.map(function(c){return c.name;}),datasets:[{label:'المبلغ',data:top.map(function(c){return c.total;}),backgroundColor:top.map(function(c,i){return RPT_C.pal[i%RPT_C.pal.length];}),borderRadius:3}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}},'أكبر 10 فئات');
